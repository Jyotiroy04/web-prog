<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Information</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
        <div class="wrap">
                <img src="assets/logo.svg" alt="NetCo" class="logo">
                <h1 class="brand">Network User Portal</h1>
        </div>
    </header>

    <main class="wrap">
        <section class="card">
            <h2>User Record</h2>
            <div id="content">Loading…</div>
            <div style="margin-top:18px;text-align:right"><a class="primary" href="index.html">Back to form</a></div>
        </section>
    </main>

    <footer class="site-footer"><div class="wrap">© NetCo — Network Management</div></footer>

    <script>
    function getParam(key) {
        const params = new URLSearchParams(window.location.search);
        return params.get(key) || '';
    }

    const fields = [
        ['Full Name','name'],
        ['Phone Number','phone'],
        ['Address','address'],
        ['Age','age'],
        ['Gender','gender'],
        ['Country','country'],
        ['State','state'],
        ['City','city'],
        ['Pincode','pincode']
    ];

    const container = document.getElementById('content');
    const dl = document.createElement('dl');

    let any = false;
    for (const [label,key] of fields) {
        const value = getParam(key);
        const dt = document.createElement('dt'); dt.textContent = label + ':';
        const dd = document.createElement('dd');
        if (value) { dd.textContent = value; any = true; }
        else { dd.innerHTML = '<span class="empty">(not provided)</span>'; }
        dl.appendChild(dt);
        dl.appendChild(dd);
    }

    container.innerHTML = '';
    if (!any && window.location.search === '') {
        container.innerHTML = '<p class="empty">No data received. Submit the form first.</p>';
    } else {
        container.appendChild(dl);
    }
</script>

</body>
</html>
