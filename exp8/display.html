<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Information</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f4f9; padding:20px; }
        .card { max-width:700px; margin:auto; background:#fff; padding:24px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        h2 { text-align:center; color:#333; }
        dl { display:grid; grid-template-columns:150px 1fr; gap:8px 16px; }
        dt { font-weight:600; color:#555; }
        dd { margin:0; color:#222; }
        .empty { color:#888; font-style:italic; }
        .actions { margin-top:18px; }
        a.button { display:inline-block; padding:10px 14px; background:#007BFF; color:#fff; border-radius:6px; text-decoration:none; }
    </style>
</head>
<body>
<div class="card">
    <h2>Submitted Information</h2>
    <div id="content">
        <p>Loading submitted data…</p>
    </div>
    <div class="actions">
        <a class="button" href="index.html">Edit / Submit again</a>
    </div>
</div>

<script>
    function getParam(key) {
        const params = new URLSearchParams(window.location.search);
        return params.get(key) || '';
    }

    const fields = [
        ['Full Name','name'],
        ['Phone Number','phone'],
        ['Address','address'],
        ['Age','age'],
        ['Gender','gender'],
        ['Country','country'],
        ['State','state'],
        ['City','city'],
        ['Pincode','pincode']
    ];

    const container = document.getElementById('content');
    const dl = document.createElement('dl');

    let any = false;
    for (const [label,key] of fields) {
        const value = getParam(key);
        const dt = document.createElement('dt'); dt.textContent = label + ':';
        const dd = document.createElement('dd');
        if (value) { dd.textContent = value; any = true; }
        else { dd.innerHTML = '<span class="empty">(not provided)</span>'; }
        dl.appendChild(dt);
        dl.appendChild(dd);
    }

    container.innerHTML = '';
    if (!any && window.location.search === '') {
        container.innerHTML = '<p class="empty">No data received. Submit the form first.</p>';
    } else {
        container.appendChild(dl);
    }
</script>

</body>
</html>
