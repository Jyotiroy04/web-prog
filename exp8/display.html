<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Network User — Details</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <img src="assets/logo.svg" alt="NetCo" class="logo">
      <h1 class="brand">Network User Portal</h1>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>User Record</h2>
      <div id="content">Loading…</div>
      <div style="margin-top:18px;text-align:right"><a class="primary" href="index.html">Back to form</a></div>
    </section>
  </main>

  <footer class="site-footer"><div class="wrap">© NetCo — Network Management</div></footer>

  <script>
    function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    const params = new URLSearchParams(window.location.search);
    const get = k => params.get(k) || '';
    const rows = [
      ['Full Name','name'],['Username','username'],['Email','email'],['Phone','phone'],
      ['Department','department'],['Role','role'],['Location','location'],['Notes','notes']
    ];
    const container = document.getElementById('content');
    const dl = document.createElement('dl'); dl.style.display='grid'; dl.style.gridTemplateColumns='160px 1fr'; dl.style.gap='8px 16px';
    let any=false;
    for(const [label,key] of rows){
      const dt=document.createElement('dt'); dt.textContent = label+':'; dt.style.fontWeight=600; dt.style.color='#555';
      const dd=document.createElement('dd'); dd.style.margin=0; const v=get(key); if(v){ dd.textContent = v; any=true; } else { dd.innerHTML='(not provided)'; }
      dl.appendChild(dt); dl.appendChild(dd);
    }
    if(!any && window.location.search===''){
      container.innerHTML = '<p style="color:#888">No data received. Submit the form first.</p>';
    } else {
      container.innerHTML=''; container.appendChild(dl);
    }
  </script>
</body>
</html>
