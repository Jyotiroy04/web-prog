<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Network User Portal</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="Network user registration and details">
    <link rel="icon" href="assets/logo.svg">
</head>
<body>
<header class="site-header">
    <div class="wrap">
        <img src="assets/logo.svg" alt="NetCo" class="logo">
        <h1 class="brand">Network User Portal</h1>
    </div>
    <p class="tag">Register a network user and view details instantly</p>
</header>

<main class="wrap">
    <section class="card form-card">
        <h2>Register Network User</h2>
        <form action="display.html" method="GET" class="form-grid">
            <label>Full Name<input type="text" name="name" required></label>
            <label>Username<input type="text" name="username" required></label>
            <label>Email<input type="text" name="email" required></label>
            <label>Phone<input type="tel" name="phone" pattern="[0-9]{10}" placeholder="10 digits"></label>
            <label>Department<input type="text" name="department"></label>
            <label>Role<select name="role">
                <option>End User</option>
                <option>Admin</option>
                <option>Guest</option>
            </select></label>
            <label>Location<input type="text" name="location"></label>
            <label>Notes<textarea name="notes"></textarea></label>
            <div class="form-actions">
                <button type="submit" class="primary">Submit & View</button>
            </div>
        </form>
    </section>

    <section class="card info-card">
        <h3>Quick Tips</h3>
        <ul>
            <li>Use corporate username conventions (first.last)</li>
            <li>Provide accurate department and role</li>
            <li>Click "Submit & View" to preview the user record</li>
        </ul>
    </section>
</main>

<footer class="site-footer">
    <div class="wrap">© NetCo — Network Management</div>
</footer>

</body>
</html>
