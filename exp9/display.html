<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .display-container {
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            border-bottom: 2px solid #007BFF;
            padding-bottom: 10px;
        }
        .info-row {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            display: flex;
        }
        .info-label {
            font-weight: bold;
            width: 150px;
            color: #555;
        }
        .info-value {
            color: #333;
            flex: 1;
        }
        .back-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #6c757d;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .back-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="display-container">
    <h2>Submitted User Information</h2>
    
    <div id="result">
        <!-- JavaScript will dynamically populate the form data here -->
    </div>

    <a href="form.html" class="back-btn">Go Back</a>
</div>

<script>
    // Extract query parameters from the URL
    const urlParams = new URLSearchParams(window.location.search);
    
    // Fields we expect from the form
    const fields = [
        { key: 'name', label: 'Full Name' },
        { key: 'phone', label: 'Phone Number' },
        { key: 'address', label: 'Address' },
        { key: 'age', label: 'Age' },
        { key: 'gender', label: 'Gender' },
        { key: 'country', label: 'Country' },
        { key: 'state', label: 'State' },
        { key: 'city', label: 'City' },
        { key: 'pincode', label: 'Pincode' }
    ];

    let htmlContent = '';

    // Loop through each field and fetch its value from the URL
    fields.forEach(field => {
        let value = urlParams.get(field.key);
        // Fallback if data is missing
        if (!value) value = 'Not Provided';
        
        htmlContent += `
            <div class="info-row">
                <div class="info-label">${field.label}:</div>
                <div class="info-value">${escapeHtml(value)}</div>
            </div>
        `;
    });

    // Inject the generated HTML into the result container
    document.getElementById('result').innerHTML = htmlContent;

    // Basic security helper function to prevent unwanted script injections
    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;")
                   .replace(/</g, "&lt;")
                   .replace(/>/g, "&gt;")
                   .replace(/"/g, "&quot;")
                   .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
