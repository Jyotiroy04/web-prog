<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Employee — Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="wrap">
            <img src="assets/company-logo.svg" alt="Company" class="logo">
            <h1 class="brand">Employee Directory</h1>
        </div>
    </header>

    <main class="wrap">
        <section class="card">
            <div id="profile" style="display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:start">
                <div id="avatar" style="width:120px;height:120px;border-radius:12px;background:linear-gradient(135deg,#0a4a8a,#2aa3ff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700"></div>
                <div>
                    <h2 id="name">Employee</h2>
                    <p id="role" style="color:var(--muted)"></p>
                </div>
            </div>
            <hr style="margin:18px 0">
            <div id="details"></div>
            <div style="margin-top:18px;text-align:right"><a class="primary" href="index.html">Back</a></div>
        </section>
    </main>

    <footer class="site-footer"><div class="wrap">© Company — HR</div></footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const get = k => params.get(k) || '';
        const name = get('name');
        const initials = (name || 'NA').split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();
        document.getElementById('avatar').textContent = initials;
        document.getElementById('name').textContent = name || '(No name)';
        document.getElementById('role').textContent = get('position') + ' — ' + get('department');

        const rows = [
            ['Employee ID','empId'],['Email','email'],['Phone','phone'],['Manager','manager'],['Office','office'],['Start Date','startDate'],['Notes','notes']
        ];
        const container = document.getElementById('details');
        const dl = document.createElement('dl'); dl.style.display='grid'; dl.style.gridTemplateColumns='160px 1fr'; dl.style.gap='8px 16px';
        for (const [label,key] of rows){
            const dt=document.createElement('dt'); dt.textContent = label+':'; dt.style.fontWeight=600; dt.style.color='#555';
            const dd=document.createElement('dd'); dd.style.margin=0; dd.textContent = get(key) || '(not provided)';
            dl.appendChild(dt); dl.appendChild(dd);
        }
        container.appendChild(dl);
    </script>
</body>
</html>
