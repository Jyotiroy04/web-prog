<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Employee Directory — Company</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/company-logo.svg">
  <meta name="description" content="Add or update company employee information">
  <style>/* small override for layout */body{background:#f7f9fc}</style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <img src="assets/company-logo.svg" alt="Company" class="logo">
      <h1 class="brand">Employee Directory</h1>
    </div>
    <p class="tag">Collect and view employee records</p>
  </header>

  <main class="wrap">
    <section class="card form-card">
      <h2>Add / Update Employee</h2>
      <form action="display.html" method="GET" class="form-grid">
        <label>Employee ID<input type="text" name="empId" required></label>
        <label>Full Name<input type="text" name="name" required></label>
        <label>Email<input type="email" name="email" required></label>
        <label>Phone<input type="tel" name="phone" pattern="[0-9]{10}"></label>
        <label>Department<input type="text" name="department"></label>
        <label>Position<input type="text" name="position"></label>
        <label>Manager<input type="text" name="manager"></label>
        <label>Office Location<input type="text" name="office"></label>
        <label>Start Date<input type="date" name="startDate"></label>
        <label>Notes<textarea name="notes"></textarea></label>
        <div class="form-actions"><button class="primary" type="submit">Submit</button></div>
      </form>
    </section>
    <section class="card info-card">
      <h3>Guidelines</h3>
      <ul>
        <li>Use official company email and ID</li>
        <li>Keep manager and department accurate</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer"><div class="wrap">© Company — HR</div></footer>
</body>
</html>
