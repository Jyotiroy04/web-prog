<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #eef2f5;
        }

        .calculator {
            background-color: #22252d;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 320px;
        }

        /* Display Screen */
        .display {
            width: 100%;
            height: 80px;
            background-color: #292d36;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 32px;
            text-align: right;
            padding: 15px;
            outline: none;
        }

        /* Buttons Grid */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #292d36;
            color: #ffffff;
        }

        button:hover {
            opacity: 0.8;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Distinct colors for specific operations */
        .operator {
            color: #eb6666;
        }

        .action {
            color: #26e7a6;
        }

        .equal {
            background-color: #26e7a6;
            color: #22252d;
            grid-column: span 2;
        }

        .equal:hover {
            background-color: #20c991;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- Input display screen -->
        <input type="text" id="display" class="display" readonly placeholder="0">

        <!-- Calculator Buttons Grid -->
        <div class="buttons">
            <button class="action" onclick="clearDisplay()">C</button>
            <button class="action" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">&divide;</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">&times;</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">&minus;</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        // Append input numbers/operators to display
        function appendValue(val) {
            display.value += val;
        }

        // Clear the entire screen
        function clearDisplay() {
            display.value = '';
        }

        // Delete the last entered character
        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        // Evaluate and calculate arithmetic expression
        function calculateResult() {
            try {
                if (display.value.trim() !== "") {
                    // Evaluate the arithmetic expression inside the input box
                    display.value = eval(display.value);
                }
            } catch (error) {
                display.value = 'Error';
                setTimeout(() => clearDisplay(), 1500);
            }
        }
    </script>

</body>
</html>
