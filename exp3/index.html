<!DOCTYPE html>
<html>
<head>
    <title>Book Information Portal</title>
</head>

<!-- We use <frameset> instead of <body> for frame layouts -->
<frameset cols="30%, 70%">
    <!-- Left frame loads left.html -->
    <frame src="left.html" name="leftFrame">
    
    <!-- Right frame loads right.html by default -->
    <frame src="right.html" name="rightFrame">
    
    <noframes>
        <body>
            <h1>Welcome to the Book Information Portal</h1>
            <p>If your browser doesn't support frames, select a book below to view details.</p>
        </body>
    </noframes>
</frameset>
</html>
