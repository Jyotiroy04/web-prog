<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.03em;
        }

        tr {
            border-bottom: 1px solid #dddddd;
        }

        tr:nth-of-type(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .price {
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

    <h2>Product Details</h2>

    <table>
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Brand</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Wireless Bluetooth Headphones</td>
                <td>Sony</td>
                <td class="price">$199.99</td>
            </tr>
            <tr>
                <td>Galaxy S23 Ultra</td>
                <td>Samsung</td>
                <td class="price">$1,199.00</td>
            </tr>
            <tr>
                <td>MacBook Air M2</td>
                <td>Apple</td>
                <td class="price">$1,099.00</td>
            </tr>
            <tr>
                <td>Running Shoes (Air Max)</td>
                <td>Nike</td>
                <td class="price">$120.50</td>
            </tr>
            <tr>
                <td>Mechanical Gaming Keyboard</td>
                <td>Logitech</td>
                <td class="price">$89.99</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
